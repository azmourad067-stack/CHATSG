# Expériences à la demande (Actions → experiment → Run workflow). Lecture seule.
#   neural : réseau de neurones contre le modèle actuel (walk-forward complet)
#   combos : paris combinés (couplé, trio, 2 sur 4) simulés aux rapports officiels
#   ranks  : simple gagnant / placé sur le k-ième cheval (toutes, quinté, pick 5),
#            éventuellement limité à une période [start, end]
#   segments : analyse par discipline, partants, distance, réunion, groupe et rang
#              (tableaux complets en CSV dans l'artefact « analyses »)
#   frozen : validation des règles figées le 10/11/2026 sur [start, end]
name: experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Expérience"
        type: choice
        options: [neural, combos, ranks, segments, frozen]
        default: neural
      start:
        description: "ranks / frozen : date de début (AAAA-MM-JJ, facultatif)"
        required: false
        default: ""
      end:
        description: "ranks / frozen : date de fin (AAAA-MM-JJ, facultatif)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HI_DATA_DIR: ${{ github.workspace }}/data_store
      EXPERIMENT: ${{ github.event.inputs.experiment }}
      START: ${{ github.event.inputs.start }}
      END: ${{ github.event.inputs.end }}
    steps:
      - name: Vérifier la configuration
        run: test -n "$DATABASE_URL" || { echo "Secret DATABASE_URL absent."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-train.txt "psycopg[binary]>=3.2"
      - if: env.EXPERIMENT == 'neural'
        run: pip install -r requirements-dl.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Réseau de neurones vs LightGBM (walk-forward)
        if: env.EXPERIMENT == 'neural'
        run: python scripts/experiment_neural.py
      - name: Paris combinés (rapports officiels)
        if: env.EXPERIMENT == 'combos'
        run: python scripts/backtest_combos.py
      - name: Stratégies par rang, ou validation des règles figées
        if: env.EXPERIMENT == 'ranks' || env.EXPERIMENT == 'frozen'
        run: |
          args=()
          for v in START END; do
            val="${!v}"
            [ -z "$val" ] && continue
            [[ "$val" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Date invalide : $val"; exit 1; }
            args+=("--${v,,}" "$val")
          done
          if [ "$EXPERIMENT" = "frozen" ]; then
            python scripts/validate_frozen_rules.py "${args[@]}"
          else
            python scripts/backtest_ranks.py "${args[@]}"
          fi
      - name: Analyse par segment
        if: env.EXPERIMENT == 'segments'
        run: python scripts/analyse_segments.py --out analyses
      - uses: actions/upload-artifact@v4
        if: env.EXPERIMENT == 'segments'
        with:
          name: analyses
          path: analyses
          retention-days: 30
