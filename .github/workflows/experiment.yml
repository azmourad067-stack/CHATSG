# Expériences à la demande (Actions → experiment → Run workflow). Lecture seule.
#   neural : réseau de neurones contre le modèle actuel (walk-forward complet)
#   combos : paris combinés (couplé, trio, 2 sur 4) simulés aux rapports officiels
#   ranks  : simple gagnant / placé sur le k-ième cheval (toutes, quinté, pick 5),
#            éventuellement limité à une période [start, end]
#   segments : analyse par discipline, partants, distance, réunion, groupe et rang
#              (tableaux complets en CSV dans l'artefact « analyses »)
#   frozen : validation des règles figées le 10/11/2026 sur [start, end]
#   features : variables v2 (vitesse, ferrure, aptitudes, forme récente) vs modèle actuel
#   features3 : variables v3 (terrain, catégorie, distance, couple, entraîneur) vs production
#   features4 : variables v4 (origines, valeur handicap) vs production
#   models : LightGBM classement par course, CatBoost, empilement vs modèle actuel
#   place : modèle appris sur « placé » vs Harville appliqué au modèle gagnant
#   betting2 : combinés avec le modèle placé + espérance au rapport final prévu
#   tuning : réglage de LightGBM choisi sur la 1re moitié des plis, jugé sur la 2nde
#   tuning_large : réglage « large » contre la production, sur chaque moitié des plis
#   tierce_quinte : 20 combinaisons de tiercé par quinté (rattrape d'abord les rapports désordre)
#   quinte_plus : Quinté+, nombre de combinaisons contre gain (combinés, 1 base)
#   profiles : profils de course (rang × cote × discipline × partants), gagnant / placé
#   grand_search : ~8 600 stratégies (simples + combinés), découverte / validation / test final
#   frozen_national : règle trot G sur réunions nationales vs régionales
#   bankroll : simulation d'années de paris (règle 3e du modèle, gagnant, trot G)
name: experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Expérience"
        type: choice
        options: [neural, combos, ranks, segments, frozen, bankroll, features, features3, features4, models, place, betting2, tuning, tuning_large, frozen_national, tierce_quinte, quinte_plus, profiles, grand_search]
        default: neural
      start:
        description: "ranks / frozen : date de début (AAAA-MM-JJ, facultatif)"
        required: false
        default: ""
      end:
        description: "ranks / frozen : date de fin (AAAA-MM-JJ, facultatif)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HI_DATA_DIR: ${{ github.workspace }}/data_store
      EXPERIMENT: ${{ github.event.inputs.experiment }}
      START: ${{ github.event.inputs.start }}
      END: ${{ github.event.inputs.end }}
    steps:
      - name: Vérifier la configuration
        run: test -n "$DATABASE_URL" || { echo "Secret DATABASE_URL absent."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-train.txt "psycopg[binary]>=3.2"
      - if: env.EXPERIMENT == 'neural'
        run: pip install -r requirements-dl.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Réseau de neurones vs LightGBM (walk-forward)
        if: env.EXPERIMENT == 'neural'
        run: python scripts/experiment_neural.py
      - name: Paris combinés (rapports officiels)
        if: env.EXPERIMENT == 'combos'
        run: python scripts/backtest_combos.py
      - name: Stratégies par rang, ou validation des règles figées
        if: env.EXPERIMENT == 'ranks' || env.EXPERIMENT == 'frozen'
        run: |
          args=()
          for v in START END; do
            val="${!v}"
            [ -z "$val" ] && continue
            [[ "$val" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Date invalide : $val"; exit 1; }
            args+=("--${v,,}" "$val")
          done
          if [ "$EXPERIMENT" = "frozen" ]; then
            python scripts/validate_frozen_rules.py "${args[@]}"
          else
            python scripts/backtest_ranks.py "${args[@]}"
          fi
      - if: env.EXPERIMENT == 'models'
        run: pip install -r requirements-boost.txt
      - name: Autres modèles vs LightGBM (walk-forward)
        if: env.EXPERIMENT == 'models'
        run: python scripts/experiment_models.py
      - name: Variables v2 vs modèle actuel (walk-forward)
        if: env.EXPERIMENT == 'features'
        run: python scripts/experiment_features.py
      - name: Variables v3 vs production (walk-forward)
        if: env.EXPERIMENT == 'features3'
        run: python scripts/experiment_features.py --stage v3
      - name: Variables v4 vs production (walk-forward)
        if: env.EXPERIMENT == 'features4'
        run: python scripts/experiment_features.py --stage v4
      - name: Modèle placé vs Harville (walk-forward)
        if: env.EXPERIMENT == 'place'
        run: python scripts/experiment_place.py
      - name: Combinés avec le modèle placé et rapport final prévu
        if: env.EXPERIMENT == 'betting2'
        run: python scripts/experiment_betting2.py
      - name: Réglage de LightGBM (walk-forward)
        if: env.EXPERIMENT == 'tuning'
        run: python scripts/experiment_tuning.py
      - name: Réglage « large » contre la production (walk-forward)
        if: env.EXPERIMENT == 'tuning_large'
        run: python scripts/experiment_tuning.py --large
      - name: Rapports désordre des quintés (rattrapage idempotent)
        if: env.EXPERIMENT == 'tierce_quinte'
        run: python scripts/backfill_desordre.py
      - name: Tiercé du quinté, 20 combinaisons
        if: env.EXPERIMENT == 'tierce_quinte'
        run: python scripts/experiment_tierce_quinte.py
      - name: Quinté+, nombre de combinaisons contre gain
        if: env.EXPERIMENT == 'quinte_plus'
        run: python scripts/experiment_quinte_plus.py
      - name: Profils de course, gagnant / placé
        if: env.EXPERIMENT == 'profiles'
        run: python scripts/experiment_profiles.py
      - name: Grande recherche de stratégies (simples + combinés)
        if: env.EXPERIMENT == 'grand_search'
        run: python scripts/experiment_grand_search.py
      - name: Règle trot G, réunions nationales vs régionales
        if: env.EXPERIMENT == 'frozen_national'
        run: python scripts/frozen_by_audience.py
      - name: Simulation de bankroll (Monte-Carlo)
        if: env.EXPERIMENT == 'bankroll'
        run: python scripts/simulate_bankroll.py
      - name: Analyse par segment
        if: env.EXPERIMENT == 'segments'
        run: python scripts/analyse_segments.py --out analyses
      - uses: actions/upload-artifact@v4
        if: env.EXPERIMENT == 'segments'
        with:
          name: analyses
          path: analyses
          retention-days: 30
