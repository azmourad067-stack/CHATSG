# Collecte intrajournalière + prédictions figées avant départ, toutes les 15 min.
# Nécessite le secret de dépôt DATABASE_URL (PostgreSQL persistant). Sans lui, rien n'est fait.
# GitHub déclenche très mal les planifications de ce dépôt (3 exécutions sur ~48 prévues,
# d'autres avec 4 h de retard ou jamais) : chaque exécution boucle elle-même toutes les
# 15 min pendant ~5 h 40, puis se relance (workflow_dispatch) jusqu'à 21 h 30 UTC. Les
# planifications horaires ne servent qu'à amorcer la chaîne le matin ou à la reprendre si
# elle se rompt ; une exécution surnuméraire attend, puis est remplacée par la suivante.
# Coût : ~12 h de machine par jour, gratuit en dépôt public (pas en dépôt privé).
name: collect

on:
  schedule:
    - cron: "3 7-20 * * *"   # amorces horaires (la plupart sont ignorées par GitHub)
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # relance de la chaîne

# Groupe propre : la chaîne ne doit jamais remplacer une tâche nocturne ou un backfill en
# attente dans le groupe database-writes. La collecte s'arrête à 21 h 45, avant la nuit.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HI_DATA_DIR: ${{ github.workspace }}/data_store
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL absent : collecte ignorée."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements.txt "psycopg[binary]>=3.2"
      - name: Cotes avant départ, résultats récents et prédictions (toutes les 15 min)
        id: loop
        if: steps.cfg.outputs.skip != 'true'
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          stop=$(date -u -d "21:45" +%s)
          [ "$stop" -lt "$end" ] && end=$stop
          while [ "$(date +%s)" -lt "$end" ]; do
            tick=$(date +%s)
            python scripts/refresh_data.py --countries FRA --window-minutes 45 || echo "::warning::collecte en échec"
            python scripts/predict_upcoming.py --window-minutes 45 || echo "::warning::prédictions en échec"
            next=$(( tick + 900 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
      - name: Relancer la chaîne de collecte
        # seulement après une boucle complète : un échec d'installation ne doit pas
        # relancer la chaîne en rafale (les amorces horaires prennent le relais)
        if: steps.loop.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$(date +%s)" -lt "$(date -u -d "21:30" +%s)" ]; then
            gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
          else
            echo "Fin de journée : la chaîne reprendra demain matin."
          fi
