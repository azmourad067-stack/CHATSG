# Collecte intrajournalière + prédictions figées avant départ, toutes les 15 min.
# Nécessite le secret de dépôt DATABASE_URL (PostgreSQL persistant). Sans lui, rien n'est fait.
# GitHub déclenche très mal les planifications de ce dépôt (des journées entières sans aucune
# exécution) : la collecte est donc une chaîne permanente. Chaque exécution boucle ~5 h 40
# (collecte toutes les 15 min entre 9 h 30 et 21 h 45 UTC, simple attente la nuit), puis se
# relance elle-même (workflow_dispatch). Les planifications horaires ne servent qu'à reprendre
# la chaîne si elle se rompt ; une exécution surnuméraire attend, puis est remplacée.
# Coût : une machine en continu, gratuit en dépôt public (pas en dépôt privé).
name: collect

on:
  schedule:
    - cron: "3 * * * *"   # reprise si la chaîne s'est rompue (souvent ignoré par GitHub)
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # relance de la chaîne

# Groupe propre : la chaîne ne doit jamais remplacer une tâche nocturne ou un backfill en
# attente dans le groupe database-writes. La nuit, elle n'écrit rien en base.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HI_DATA_DIR: ${{ github.workspace }}/data_store
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL absent : collecte ignorée."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements.txt "psycopg[binary]>=3.2"
      - name: Cotes avant départ, résultats récents et prédictions (toutes les 15 min)
        id: loop
        if: steps.cfg.outputs.skip != 'true'
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            tick=$(date +%s)
            hm=$(date -u +%H%M)
            if [ "$hm" -ge 0930 ] && [ "$hm" -lt 2145 ]; then
              python scripts/refresh_data.py --countries FRA --window-minutes 45 || echo "::warning::collecte en échec"
              python scripts/predict_upcoming.py --window-minutes 45 || echo "::warning::prédictions en échec"
            fi
            next=$(( tick + 900 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
      - name: Relancer la chaîne de collecte
        # seulement après une boucle complète : un échec d'installation ne doit pas
        # relancer la chaîne en rafale (les amorces horaires prennent le relais)
        if: steps.loop.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
