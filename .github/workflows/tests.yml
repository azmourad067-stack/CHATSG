name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest (SQLite)
        run: pytest -q

  postgres:
    # Même suite de tests sur PostgreSQL, la base utilisée en production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hi
          POSTGRES_PASSWORD: hi
          POSTGRES_DB: horse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hi" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      HI_TEST_DATABASE_URL: postgresql+psycopg://hi:hi@localhost:5432/horse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest (PostgreSQL)
        run: pytest -q
