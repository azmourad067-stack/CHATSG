# Envoie un SMS de test (Free Mobile) pour vérifier la configuration des alertes.
# Nécessite les secrets de dépôt FREE_MOBILE_USER et FREE_MOBILE_KEY.
name: alert_test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FREE_MOBILE_USER: ${{ secrets.FREE_MOBILE_USER }}
      FREE_MOBILE_KEY: ${{ secrets.FREE_MOBILE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/send_test_alert.py
