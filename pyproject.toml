[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "horse-intelligence"
version = "0.1.0"
description = "Laboratoire d'intelligence prédictive hippique (usage personnel, analyse uniquement)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "pyyaml>=6.0",
    "plotly>=5.20",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
train = ["scipy>=1.12"]
dev = [
    "scipy>=1.12",
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "network: test de contrat qui interroge une vraie API (désactivé par défaut)",
]
addopts = "-m 'not network'"
filterwarnings = [
    # adaptateur de dates sqlite3 (Python 3.12) utilisé par SQLAlchemy : sans effet ici
    "ignore:The default date adapter is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères accentués français autorisés

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["horse_intelligence"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["horse_intelligence.data.*", "horse_intelligence.services.*"]
disallow_untyped_defs = true
